<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Pending Tasks</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">TaskFlow</h2>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Dashboard</a>
                <a href="tasks.html">My Tasks</a>
                <a href="pending.html" class="active">Pending</a>
                <a href="in-progress.html">In Progress</a>
                <a href="completed.html">Completed</a>
                <a href="settings.html">Settings</a>

            </nav>

            <a href="index.html" class="logout-link">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="dashboard-main">

            <!-- Header -->
            <header class="dashboard-header">

                <div>
                    <h1>Pending Tasks</h1>

                    <p>
                        Here are the tasks you still need to complete.
                    </p>
                </div>

            </header>


            <!-- Pending Tasks -->
            <section class="tasks-section">

                <div class="tasks-header">

                    <h2>Pending Tasks</h2>

                </div>


                <!-- Pending Task -->
                <!-- <div class="task-item">

                    <div class="task-info">

                        <h3>Complete My Project</h3>

                        <p>
                            Check if my codes is correct and ready to be hosted.
                        </p>

                        <div class="task-details">
                            <span class="priority high">Priority: High</span>
                            <span class="task-status pending-status">Status: Pending</span>
                            <span>Category: School</span>
                            <span>Due Date: Oct 5, 2026</span>
                            <span>Due Time: 5:00 PM</span>
                        </div>

                    </div>

                </div> -->

            </section>

        </main>

    </div>





    <script>

        const Todolist = JSON.parse(localStorage.getItem('Todolists')) || [];

        Todolist.forEach((task) => {

            if(task.status === 'pending'){

                const taskItem = document.createElement('div');
                taskItem.classList.add('task-item');

                taskItem.innerHTML = `
                    <div class="task-info">
                        <h3>${task.title}</h3>
                        <p>${task.description}</p>
                        <div class="task-details">
                            <span class="priority ${task.priority}">Priority: ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
                            <span class="task-status pending-status">Status: ${task.status.charAt(0).toUpperCase() + task.status.slice(1)}</span>
                            <span>Category: ${task.category.charAt(0).toUpperCase() + task.category.slice(1)}</span>
                            <span>Due Date: ${new Date(task.dueDate).toLocaleDateString()}</span>
                            <span>Due Time: ${task.dueTime}</span>
                        </div>
                    </div>
                `;

                document.querySelector('.tasks-section').appendChild(taskItem);
            }
            





        });






    </script>

</body>

</html>
