<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Completed Tasks</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">TaskFlow</h2>

            <nav class="sidebar-nav">

                <a href="dashboard.html">Dashboard</a>
                <a href="tasks.html">My Tasks</a>
                <a href="pending.html">Pending</a>
                <a href="in-progress.html">In Progress</a>
                <a href="completed.html" class="active">Completed</a>
                <a href="settings.html">Settings</a></nav>

            <a href="index.html" class="logout-link">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="dashboard-main">

            <!-- Header -->
            <header class="dashboard-header">

                <div>
                    <h1>Completed Tasks</h1>

                    <p>
                        Here are the tasks you have successfully completed.
                    </p>
                </div>

            </header>


            <!-- Completed Tasks -->
            <section class="tasks-section">

                <div class="tasks-header">

                    <h2>Completed Tasks</h2>

                </div>

                <!-- Task 1 -->
                <div class="task-item">

                    <!-- <div class="task-info">

                        <h3>Design TaskFlow Dashboard</h3>

                        <p class="task-description">
                            Complete the layout and styling of the TaskFlow dashboard.
                        </p>

                        <div class="task-details">
                            <span class="priority high">Priority: High</span>
                            <span class="task-status completed-status">Status: Completed</span>
                            <span>Category: Work</span>
                            <span>Due Date: Oct 3, 2026</span>
                            <span Due Time: 6:00 PM</span>
                        </div>
                    </div> -->
                  </div>

                </div>

            </section>

        </main>

    </div>



    <script>

const Todolist = JSON.parse(localStorage.getItem('Todolists')) || [];

        Todolist.forEach((task) => {

            if(task.status === 'completed'){

                const taskItem = document.createElement('div');
                taskItem.classList.add('task-item');

                taskItem.innerHTML = `
                    <div class="task-info">
                        <h3>${task.title}</h3>
                        <p>${task.description}</p>
                        <div class="task-details">
                            <span class="priority ${task.priority}">Priority: ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
                            <span class="task-status completed-status">Status: ${task.status.charAt(0).toUpperCase() + task.status.slice(1)}</span>
                            <span>Category: ${task.category.charAt(0).toUpperCase() + task.category.slice(1)}</span>
                            <span>Due Date: ${new Date(task.dueDate).toLocaleDateString()}</span>
                            <span>Due Time: ${task.dueTime}</span>
                        </div>
                    </div>
                `;

                document.querySelector('.tasks-section').appendChild(taskItem);
            }
            





        });



    </script>
</body>

</html>
