<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - In Progress</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <aside class="sidebar">

            <h2 class="logo">TaskFlow</h2>

            <nav class="sidebar-nav">

            <a href="dashboard.html">Dashboard</a>
            <a href="tasks.html">My Tasks</a>
            <a href="pending.html">Pending</a>
            <a href="in-progress.html" class="active">In Progress</a>
            <a href="completed.html">Completed</a>
            <a href="settings.html">Settings</a>

            </nav>

            <a href="index.html" class="logout-link">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="dashboard-main">

            <!-- Header -->
            <header class="dashboard-header">

                <div>
                    <h1>In - Progress</h1>

                    <p>
                        Here are the tasks you are currently working on.
                    </p>
                </div>

            </header>


            <!-- In Progress Tasks -->
            <section class="tasks-section">

                <div class="tasks-header">

                    <h2>In - Progress Tasks</h2>

                </div>


                <!-- In Progress Task -->
                <div class="task-item">

                    <!-- <div class="task-info">

                        <h3>Buy Garri</h3>

                        <p>
                            Review if my Garri is still intact and much.
                        </p>

                         <div class="task-details">
                            <span class="priority medium">Medium: medium</span>
                            <span class="task-status progress-status">Status:In - Progress</span>
                            <span>Category: School</span>
                            <span>Due Date: Oct 7, 2026</span>
                            <span>Due Time: 3:00 PM</span>
                        </div>

                    </div> -->

                </div>

            </section>

        </main>

    </div>
    <script>

const Todolist = JSON.parse(localStorage.getItem('Todolists')) || [];

 Todolist.forEach((task) => {

            if(task.status === 'in-progress') {

                const taskItem = document.createElement('div');
                taskItem.classList.add('task-item');

                taskItem.innerHTML = `
                    <div class="task-info">
                        <h3>${task.title}</h3>
                        <p>${task.description}</p>
                        <div class="task-details">
                            <span class="priority ${task.priority}">Priority: ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
                            <span class="task-status pending-status">Status: ${task.status.charAt(0).toUpperCase() + task.status.slice(1)}</span>
                            <span>Category: ${task.category.charAt(0).toUpperCase() + task.category.slice(1)}</span>
                            <span>Due Date: ${new Date(task.dueDate).toLocaleDateString()}</span>
                            <span>Due Time: ${task.dueTime}</span>
                        </div>
                    </div>
                `;

                document.querySelector('.tasks-section').appendChild(taskItem);
            }
            





        });








    </script>

</body>

</html>
